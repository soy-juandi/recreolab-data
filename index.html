const RETOS_CSV_URL = "https://raw.githubusercontent.com/soy-juandi/recreolab-data/main/retos_idrd.csv";
// Fuente única de Recreolab (2026-08-26): Google Sheets retirado por completo —
// ver MIGRACION_RECREOLAB_SHAREPOINT.md. Formato tidy (una fila por evento),
// publicado por office-script-recreolab-matriz.ts vía Power Automate a
// recreolab-data/recreolab_matriz.csv. Sin fallback externo: si este fetch
// falla, la app cae directo a los datos embebidos (FALLBACK, más abajo).
const RECREOLAB_MATRIZ_CSV_URL = "https://raw.githubusercontent.com/soy-juandi/recreolab-data/main/recreolab_matriz.csv";
// Contrato CSV (publicado por office-script-talleres.ts vía Power Automate):
// taller,fecha,hora,lugar,participantes,grupo,sesion — fecha en dd-mm-yyyy
const TALLERES_CSV_URL = "https://raw.githubusercontent.com/soy-juandi/recreolab-data/main/talleres_oal.csv";

// ── SANITIZACIÓN ─────────────────────────────────────────────
function sanitize(val) {
  if (val === null || val === undefined) return "";
  const div = document.createElement("div");
  div.textContent = String(val).trim();
  return div.innerHTML;
}

// ── DATA FETCHING ─────────────────────────────────────────────
async function fetchCSV() {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    const res = await fetch(RECREOLAB_MATRIZ_CSV_URL + "?t=" + Date.now(), { signal: controller.signal });
    clearTimeout(timeout);
    if (res.ok) {
      const text = await res.text();
      if (text && text.length > 100) return { source:"live-sharepoint", text };
    }
  } catch(e) {}
  return null;
}

async function fetchRetosCSV() {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    const res = await fetch(RETOS_CSV_URL, { signal: controller.signal });
    clearTimeout(timeout);
    if (!res.ok) return null;
    const text = await res.text();
    if (!text || text.length < 20) return null;
    return text;
  } catch(e) { return null; }
}

// taller,fecha,hora,lugar,participantes,grupo,sesion (fecha ya en dd-mm-yyyy)
async function fetchTalleres() {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    const res = await fetch(TALLERES_CSV_URL + "?t=" + Date.now(), { signal: controller.signal });
    clearTimeout(timeout);
    if (!res.ok) return null;
    const text = await res.text();
    if (!text || text.length < 20) return null;
    const lines = parseCSV(text);
    if (lines.length < 2) return null;
    const events = [];
    for (let r = 1; r < lines.length; r++) {
      const row = lines[r];
      const taller = sanitize(row[0]?.trim() || "");
      if (!taller) continue;
      events.push({
        taller,
        fecha: sanitize(row[1]?.trim() || ""),
        hora: normalizeHora(sanitize(row[2]?.trim() || "")),
        lugar: sanitize(row[3]?.trim() || ""),
        participantes: sanitize(row[4]?.trim() || ""),
        grupo: parseInt(row[5]) || 1,
        sesion: parseInt(row[6]) || 1,
      });
    }
    if (events.length === 0) return null;
    return events;
  } catch(e) { return null; }
}

// modulo,moduloNombre,tema,fecha,tipo,hora,lugar (fecha ISO, hora ya formateada por el Office Script)
// Contrato CSV (office-script-drafe-estrategias.ts): localidad,actividad,fecha,hora,direccion
// direccion puede traer un link de Maps en una segunda línea (separada por \n) -- se separa acá.
async function fetchFortalecimiento() {
  try {
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 8000);
    const res = await fetch(FORTALECIMIENTO_CSV_URL + "?t=" + Date.now(), { signal: controller.signal });
    clearTimeout(timeout);
    if (!res.ok) return null;
    const text = await res.text();
    if (!text || text.length < 20) return null;
    const lines = parseCSV(text);
    if (lines.length < 2) return null;
    const events = [];
    for (let r = 1; r < lines.length; r++) {
      const row = lines[r];
      const localidad = sanitize(row[0]?.trim() || "");
      if (!localidad) continue;
      const direccionRaw = (row[4] || "").trim();
      const [direccion, mapsUrl] = direccionRaw.split(/\r?\n/).map(s => s.trim());
      events.push({
        tipo: "DRAFE",
        localidad,
        actividad: sanitize(row[1]?.trim() || ""),
        fecha: sanitize(row[2]?.trim() || ""),
        hora: normalizeHora(sanitize(row[3]?.trim() || "")),
        direccion: sanitize(direccion || ""),
        mapsUrl: mapsUrl && /^https?:\/\//.test(mapsUrl) ? mapsUrl : "",
      });
    }
    if (events.length === 0) return null;
    return events;
  } catch(e) { return null; }
}

function parseCSV(text) {
  const rows=[], lines=[];
  let current="", inQuotes=false;
  for (let i=0;i<text.length;i++) {
    const ch=text[i];
    if (ch==='"') { if (inQuotes&&text[i+1]==='"'){current+='"';i++;}else inQuotes=!inQuotes; }
    else if (ch===","&&!inQuotes){rows.push(current);current="";}
    else if ((ch==="\n"||ch==="\r")&&!inQuotes){
      if(current||rows.length>0){rows.push(current);lines.push(rows.splice(0));current="";rows.length=0;}
      if(ch==="\r"&&text[i+1]==="\n")i++;
    } else current+=ch;
  }
  if(current||rows.length>0){rows.push(current);lines.push(rows.splice(0));}
  return lines;
}

function normalizeHora(h) {
  if (!h) return "";
  return h
    .replace(/\s*a\.?\s*m\.?/gi,"AM").replace(/\s*p\.?\s*m\.?/gi,"PM")
    .replace(/(\d)(AM|PM)/g,"$1 $2")
    .replace(/\s+a\s+/g," – ")
    .replace(/\s{2,}/g," ").trim();
}

// ── RECREOLAB — fuente SharePoint (formato tidy, única fuente desde 2026-08-26
// — ver MIGRACION_RECREOLAB_SHAREPOINT.md) ──
const LOCALIDAD_CODES = {
  USA:"Usaquén", CHA:"Chapinero", SFE:"Santa Fe", SCR:"San Cristóbal", USM:"Usme",
  TUN:"Tunjuelito", BOS:"Bosa", KEN:"Kennedy", FON:"Fontibón", ENG:"Engativá",
  SUB:"Suba", BAR:"Barrios Unidos", TEU:"Teusaquillo", MAR:"Los Mártires",
  ANT:"Antonio Nariño", PAR:"Puente Aranda", CAN:"La Candelaria", RUU:"Rafael Uribe Uribe",
  CBO:"Ciudad Bolívar", SUM:"Sumapaz",
};

// Réplica / Recreolab Express / Recreolab Express + laboratorio se muestran
// como Playlab (mismo color/chip) — el subtipo real queda como "detalle" en
// la tarjeta del evento, no como categoría propia (decisión de Juan, 2026-08-26).
const TIPO_PREFIX_MAP = {
  ACT:"ACTIVALAB", ENF:"ENTRENALAB_FUSIONLAB", PLA:"PLAYLAB",
  REP:"PLAYLAB", EXP:"PLAYLAB", ESP:"PLAYLAB",
};

// Clasificación primaria: texto de Fase_o_Subtipo (dropdown controlado en el
// Excel, ver Adenda 3 de MIGRACION_RECREOLAB_SHAREPOINT.md). Solo Activalab y
// Sesión 2 tienen categoría propia; cualquier otro valor (Playlab, Réplica,
// Recreolab Express, Recreolab Express + laboratorio, o algo nuevo que OAL
// agregue al dropdown más adelante) cae en Playlab por defecto -- seguro por
// diseño, nunca deja un evento sin clasificar.
function claseDesdeFaseSubtipo(fase) {
  const f = (fase || "").trim();
  if (/^sesión\s*1|^activalab$/i.test(f)) return "ACTIVALAB";
  if (/^sesión\s*2|entrenalab.*fusionlab/i.test(f)) return "ENTRENALAB_FUSIONLAB";
  return "PLAYLAB";
}

function normalizeHoraV2(raw) {
  if (raw === null || raw === undefined) return "";
  const s = String(raw).trim();
  if (!s) return "";
  if (/pendiente|por definir/i.test(s)) return "Por definir";

  // Hora suelta exportada como "HH:MM" o "HH:MM:SS" (24h, sin am/pm, sin rango) --
  // el Office Script convierte el serial de Excel a este formato antes de exportar.
  const soloHora = s.match(/^(\d{1,2}):(\d{2})(?::\d{2})?$/);
  if (soloHora) {
    const h = parseInt(soloHora[1], 10);
    const m = soloHora[2];
    const ampm = h >= 12 ? "PM" : "AM";
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return `${h12}:${m} ${ampm}`;
  }

  // Rango de texto libre, mismo tratamiento que normalizeHora() (fuente vieja)
  return s
    .replace(/\s*a\.?\s*m\.?/gi, "AM")
    .replace(/\s*p\.?\s*m\.?/gi, "PM")
    .replace(/(\d)(AM|PM)/g, "$1 $2")
    .replace(/\s+a\s+/g, " – ")
    .replace(/\s{2,}/g, " ")
    .trim();
}

// Hora_inicio/Hora_cierre (2026-08-10) -- reemplaza a la columna única
// Hora_Programada; ver hallazgo en MIGRACION_RECREOLAB_SHAREPOINT.md, sección
// "2026-08-10". Cada mitad llega suelta ("9:00am", "12:00pm", sin " a " en
// medio, a diferencia del texto combinado que traía la columna vieja) --
// normalizeHoraV2() ya soporta horas sueltas (rama "solo hora sin rango"),
// acá solo se combinan las dos normalizadas.
function combinarHoraRango(inicio, cierre) {
  const hInicio = normalizeHoraV2(inicio);
  if (!hInicio || hInicio === "Por definir") return "Por definir"; // vacía o "Por definir" explícito
  const hCierre = normalizeHoraV2(cierre);
  if (!hCierre || hCierre === "Por definir") return hInicio; // sin cierre (ej. fila "En Construcción") -- solo inicio, sin rango
  return `${hInicio} – ${hCierre}`;
}

// Lee por NOMBRE de header, no por posición -- si OAL reordena columnas en el Excel
// no se rompe (solo se rompe visiblemente si renombran un header, preferible a
// mostrar datos mal ubicados en silencio).
function csvToEventosMatriz(lines) {
  if (lines.length < 2) return [];
  const headers = lines[0].map(h => h?.trim());
  const idx = name => headers.indexOf(name);
  const iId=idx("ID_Registro"), iLoc=idx("Localidad"), iNombre=idx("Nombre_Iniciativa_o_Evento"),
        iFase=idx("Fase_o_Subtipo"),
        iFecha=idx("Fecha_Programada"), iHoraInicio=idx("Hora_inicio"), iHoraCierre=idx("Hora_cierre"),
        iBarrio=idx("Barrio"), iDir=idx("Dirección"), iLugar=idx("Lugar_Especifico");

  const events = [];
  for (let r = 1; r < lines.length; r++) {
    const row = lines[r];
    const codigoLoc = row[iLoc]?.trim();
    // Mismo criterio que el Office Script (localidad no vacía, no ID_Registro):
    // así una fila nueva sin ID formal todavía no se pierde ni se clasifica mal.
    if (!codigoLoc) continue; // fila vacía (ej. la fila 2 del Excel, que viene en blanco)

    const id = row[iId]?.trim() || "";
    const faseSubtipo = row[iFase]?.trim() || "";
    // Fase_o_Subtipo (dropdown controlado) manda; el prefijo del ID_Registro
    // solo se usa si por algún motivo Fase_o_Subtipo llega vacío.
    const tipo = faseSubtipo
      ? claseDesdeFaseSubtipo(faseSubtipo)
      : (TIPO_PREFIX_MAP[id.split("-")[0]] || "PLAYLAB");
    const localidad = LOCALIDAD_CODES[codigoLoc] || codigoLoc || "Sin localidad";

    events.push({
      localidad: sanitize(localidad),
      tipo,
      detalle: sanitize(faseSubtipo), // subtipo real (ej. "Réplica") para mostrar en la tarjeta
      sesiones: 1, // cada fila ya es una sesión individual en el modelo nuevo, no hay conteo que hacer
      enlace: "",  // sin equivalente en la fuente nueva -- ver Adenda 3 del doc de migración
      gestores: "",
      nombre: sanitize(row[iNombre]?.trim() || ""),
      barrio: sanitize(row[iBarrio]?.trim() || ""),
      direccion: sanitize(row[iDir]?.trim() || ""),
      lugar: sanitize(row[iLugar]?.trim() || ""),
      fecha: sanitize(row[iFecha]?.trim() || ""),
      hora: combinarHoraRango(row[iHoraInicio]?.trim() || "", row[iHoraCierre]?.trim() || ""),
    });
  }
  return events;
}

function parseRetosCSV(text) {
  if (!text) return [];

  function serialToDate(n) {
    if (isNaN(n) || n < 40000) return null;
    const d = new Date(Math.round((n - 25569) * 86400 * 1000));
    return { y: d.getUTCFullYear(), m: d.getUTCMonth(), d: d.getUTCDate() };
  }
  function serialToTime(n) {
    if (isNaN(n) || n <= 0 || n >= 1) return "";
    const totalMin = Math.round(n * 1440);
    const h = Math.floor(totalMin / 60);
    const m = totalMin % 60;
    const hd = h > 12 ? h - 12 : h === 0 ? 12 : h;
    return hd + ":" + m.toString().padStart(2, "0") + " " + (h >= 12 ? "PM" : "AM");
  }
  function normalizeTimeStr(s) {
    if (!s) return "";
    return s.trim()
      .replace(/\s*a\.?\s*m\.?/gi, " AM").replace(/\s*p\.?\s*m\.?/gi, " PM")
      .replace(/(\d)(AM|PM)/g, "$1 $2").trim();
  }
  function isTimeStr(s) {
    return /^\d{1,2}:\d{2}\s*[APap]/.test(s.trim());
  }

  // Unir líneas de continuación (las que no empiezan con "RETO ")
  const rawLines = text.split("\n");
  const joined = [];
  for (let i = 0; i < rawLines.length; i++) {
    const line = rawLines[i].replace(/\r$/, "");
    if (/^RETO \d/i.test(line) || i === 0) {
      joined.push(line);
    } else if (joined.length > 0) {
      joined[joined.length - 1] += " " + line.trim();
    }
  }
  if (joined.length < 2) return [];

  const events = [];
  for (let i = 1; i < joined.length; i++) {
    const line = joined[i].trim();
    if (!line) continue;

    // Anclar en los primeros 2 campos: RETO X , serial_fecha
    // El resto puede tener comas dentro del lugar/metodología
    const firstComma = line.indexOf(",");
    if (firstComma < 0) continue;
    const reto = line.substring(0, firstComma).trim();
    if (!/^RETO \d/i.test(reto)) continue;

    const rest = line.substring(firstComma + 1);
    const secondComma = rest.indexOf(",");
    if (secondComma < 0) continue;
    const fechaStr = rest.substring(0, secondComma).trim();
    const afterFecha = rest.substring(secondComma + 1);

    // Parsear fecha (serial Excel o dd/mm/yyyy)
    const fechaNum = parseFloat(fechaStr);
    let parsed = null;
    if (!isNaN(fechaNum) && fechaNum > 40000) {
      parsed = serialToDate(fechaNum);
    } else {
      // intentar parseDate normal
      const m = fechaStr.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
      if (m) parsed = { y: +m[3], m: +m[2]-1, d: +m[1] };
    }
    if (!parsed) continue;

    // Ahora en afterFecha tenemos: lugar,...,horaI,horaC,asistP,metodologia,...
    // Estrategia: buscar de derecha a izquierda campos de hora y asistentes
    // Dividimos por coma y buscamos por patrón
    const parts = afterFecha.split(",");

    // Buscar campos de hora (serial decimal 0<x<1 o string "HH:MM [AP]M")
    let horaI = "", horaC = "", asistP = null;
    let lugarEndIdx = parts.length; // índice hasta donde llega el lugar

    for (let j = 0; j < parts.length; j++) {
      const val = parts[j].trim();
      const num = parseFloat(val);

      // Serial de hora (0 < n < 1)
      if (!isNaN(num) && num > 0 && num < 1) {
        if (!horaI) { horaI = serialToTime(num); lugarEndIdx = j; }
        else if (!horaC) { horaC = serialToTime(num); }
        continue;
      }
      // String de hora "6:00 p.m." / "4:30 PM"
      if (isTimeStr(val)) {
        if (!horaI) { horaI = normalizeTimeStr(val); lugarEndIdx = j; }
        else if (!horaC) { horaC = normalizeTimeStr(val); }
        continue;
      }
      // Asistentes proyectados: número entero solo
      if (/^\d+$/.test(val) && parseInt(val) > 0 && parseInt(val) < 5000) {
        if (horaI && !asistP) { asistP = parseInt(val); }
      }
    }

    const lugar = sanitize(parts.slice(0, lugarEndIdx).join(",").trim());
    let localidad = lugar.split(" - ")[0].split(".")[0].trim();
    if (localidad.length > 35) localidad = localidad.substring(0, 35);

    events.push({
      tipo:"RETO", reto, localidad, parsed, lugar,
      horaInicio: horaI, horaCierre: horaC,
      asistP, asistR: null, balance: "", ejecutado: false
    });
  }
  return events;
}

// ── PARSING ───────────────────────────────────────────────────
const MONTHS={enero:0,febrero:1,marzo:2,abril:3,mayo:4,junio:5,julio:6,agosto:7,septiembre:8,octubre:9,noviembre:10,diciembre:11};
function parseDate(s){
  if(!s)return null;
  // Tomar solo la primera línea si viene multilínea
  const firstLine=s.split(/[\n\r]/)[0];
  let str=firstLine.toLowerCase().trim()
    .replace("por definir","").replace("pendiente","")
    .replace("antes del ","").replace("antes de ","")
    .replace("por confirmar","").trim();
  if(!str)return null;
  // ISO: 2026-06-06 o 2026-06-06 00:00:00
  const iso=str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(iso)return{y:+iso[1],m:+iso[2]-1,d:+iso[3]};
  // dd/mm/yyyy
  const ddmmSlash=str.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(ddmmSlash)return{y:+ddmmSlash[3],m:+ddmmSlash[2]-1,d:+ddmmSlash[1]};
  // dd-mm-yyyy (ddmmDash)
  const ddmmDash=str.match(/^(\d{1,2})-(\d{1,2})-(\d{4})/);
  if(ddmmDash)return{y:+ddmmDash[3],m:+ddmmDash[2]-1,d:+ddmmDash[1]};
  // Mes solo: "junio"
  for(const[n,i]of Object.entries(MONTHS)){if(str===n)return{y:YEAR,m:i,d:null,monthOnly:true};}
  // "6 y 21 junio" / "4 y 11 Julio" — dos fechas mismo mes, tomar la primera
  const mYMes=str.match(/(\d{1,2})\s*y\s*\d{1,2}\s*(?:de\s+)?(\w+)/);
  if(mYMes&&MONTHS[mYMes[2]]!==undefined)return{y:YEAR,m:MONTHS[mYMes[2]],d:+mYMes[1]};
  // "28 de junio" / "28 junio"
  const m1=str.match(/(\d{1,2})\s*(?:de\s+)?(\w+)/);
  if(m1&&MONTHS[m1[2]]!==undefined)return{y:YEAR,m:MONTHS[m1[2]],d:+m1[1]};
  // "junio 28"
  const m1b=str.match(/(\w+)\s+(\d{1,2})/);
  if(m1b&&MONTHS[m1b[1]]!==undefined)return{y:YEAR,m:MONTHS[m1b[1]],d:+m1b[2]};
  // "6 o 21 junio" variantes con o/0
  const m2=str.match(/(\d{1,2})\s*[yo0]\s*\d{1,2}\s*(?:de\s+)?(\w+)/);
  if(m2&&MONTHS[m2[2]]!==undefined)return{y:YEAR,m:MONTHS[m2[2]],d:+m2[1]};
  // Mes en cualquier parte del string → monthOnly
  for(const[n,i]of Object.entries(MONTHS)){if(str.includes(n))return{y:YEAR,m:i,d:null,monthOnly:true};}
  return null;
}

function enrichEvents(evs){return evs.map(e=>({...e,parsed:parseDate(e.fecha)})).filter(e=>e.parsed);}
function enrichParques(evs){return evs.map(e=>({...e,parsed:parseDate(e.fecha)})).filter(e=>e.parsed);}
function enrichTalleres(evs){return evs.map(e=>({...e,parsed:parseDate(e.fecha)})).filter(e=>e.parsed);}
function enrichFortalecimiento(evs){return evs.map(e=>({...e,parsed:parseDate(e.fecha)})).filter(e=>e.parsed);}

function CalGrid({cells,month,dayEvents,onDayClick,accentColor,dotShape="circle"}){
  const today=new Date();
  return html`
    <div style=${{padding:"8px 12px"}}>
      <div style=${{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:2,marginBottom:4}}>
        ${DNAMES.map((d,i)=>html`<div key=${i} style=${{textAlign:"center",fontSize:10,color:C.textDim,fontWeight:700,padding:"6px 0",letterSpacing:"0.5px"}}>${d}</div>`)}
      </div>
      <div style=${{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
        ${cells.map((day,i)=>{
          if(!day)return html`<div key=${"e"+i}/>`;
          const evs=dayEvents(day),has=evs.length>0;
          const isToday=today.getDate()===day&&today.getMonth()===month&&today.getFullYear()===YEAR;
          return html`
            <div key=${day} onClick=${()=>has&&onDayClick(day)}
              style=${{minHeight:50,borderRadius:10,background:has?C.surface:"transparent",border:isToday?"2px solid "+accentColor:has?"1px solid "+C.border:"1px solid transparent",padding:4,cursor:has?"pointer":"default",transition:"all 0.15s",boxShadow:has?"0 1px 4px rgba(0,0,0,0.2)":"none"}}>
              <div style=${{fontSize:12,fontWeight:isToday?800:has?600:400,color:isToday?accentColor:has?C.text:C.textDim,textAlign:"center",marginBottom:3,fontFamily:"'JetBrains Mono'"}}>${day}</div>
              <div style=${{display:"flex",flexWrap:"wrap",gap:2,justifyContent:"center"}}>
                ${evs.slice(0,4).map((_,j)=>html`<div key=${j} style=${{width:7,height:7,borderRadius:dotShape==="circle"?"50%":2,background:accentColor}}/>`)}
                ${evs.length>4&&html`<span style=${{fontSize:7,color:C.textMuted}}>+${evs.length-4}</span>`}
              </div>
            </div>`;
        })}
      </div>
    </div>`;
}

// ── MAIN APP ──────────────────────────────────────────────────
function App(){
  const [events,setEvents]=useState([]);
  const [source,setSource]=useState("loading");
  const [month,setMonth]=useState(new Date().getMonth());
  const [filterTipo,setFilterTipo]=useState("ALL");
  const [filterLoc,setFilterLoc]=useState("ALL");
  const [view,setView]=useState("cal");
  const [selected,setSelected]=useState(null);
  const [refreshing,setRefreshing]=useState(false);
  const [showSetup,setShowSetup]=useState(false);
  const [tab,setTab]=useState("recreo");
  const [filterParque,setFilterParque]=useState("ALL");
  const [combineWith,setCombineWith]=useState({parques:true,talleres:true,retos:true,fortalecimiento:true});
  const [debug,setDebug]=useState("");
  const [retosEvents,setRetosEvents]=useState([]);
  const [retosSource,setRetosSource]=useState("idle");
  const [filterReto,setFilterReto]=useState("ALL");
  const [talleres,setTalleres]=useState(TALLERES_FALLBACK);
  const [talleresSource,setTalleresSource]=useState("loading");
  const [fortalecimiento,setFortalecimiento]=useState(FORTALECIMIENTO_FALLBACK);
  const [fortalecimientoSource,setFortalecimientoSource]=useState("loading");

  const parquesEnriched=useMemo(()=>enrichParques(PARQUES_SEG),[]);
  const talleresEnriched=useMemo(()=>enrichTalleres(talleres),[talleres]);
  const fortalecimientoEnriched=useMemo(()=>enrichFortalecimiento(fortalecimiento),[fortalecimiento]);

  const loadRecreoData=useCallback(async()=>{
    try{
      const result=await fetchCSV();
      if(result){
        if(result.text.length>500_000){setEvents(enrichEvents(FALLBACK));setSource("offline");return;}
        const lines=parseCSV(result.text);
        // Circuit breaker de seguridad -- formato tidy es 1 fila por evento, así
        // que con volumen real de OAL este límite se puede alcanzar antes de lo
        // que parece. Si "live-sharepoint" empieza a caer a offline sin motivo
        // aparente, revisar este número primero.
        if(lines.length>500){setEvents(enrichEvents(FALLBACK));setSource("offline");return;}
        const parsed = csvToEventosMatriz(lines);
        setDebug("Filas: "+lines.length+", eventos: "+parsed.length);
        if(parsed.length>0){setEvents(enrichEvents(parsed));setSource(result.source);return;}
      }
    }catch(e){setDebug("Error: "+e.message);}
    setEvents(enrichEvents(FALLBACK));setSource("offline");
  },[]);

  const loadTalleresData=useCallback(async()=>{
    setTalleresSource("loading");
    const result=await fetchTalleres();
    if(result){setTalleres(result);setTalleresSource("live");}
    else{setTalleres(TALLERES_FALLBACK);setTalleresSource("offline");}
  },[]);

  const loadFortalecimientoData=useCallback(async()=>{
    setFortalecimientoSource("loading");
    const result=await fetchFortalecimiento();
    if(result){setFortalecimiento(result);setFortalecimientoSource("live");}
    else{setFortalecimiento(FORTALECIMIENTO_FALLBACK);setFortalecimientoSource("offline");}
  },[]);

  const loadData=useCallback(async(sr)=>{
    if(sr)setRefreshing(true);
    await Promise.all([loadRecreoData(),loadTalleresData(),loadFortalecimientoData()]);
    if(sr)setRefreshing(false);
  },[loadRecreoData,loadTalleresData,loadFortalecimientoData]);

  useEffect(()=>{loadData();},[loadData]);

  useEffect(()=>{
    if((tab==="retos"||tab==="combined")&&retosSource==="idle"){
      setRetosSource("loading");
      fetchRetosCSV().then(text=>{
        if(text){setRetosEvents(parseRetosCSV(text));setRetosSource("ok");}
        else{setRetosSource("error");}
      });
    }
  },[tab,retosSource]);

  useEffect(()=>{
    if(tab==="parques")setMonth(4);
    else if(tab==="talleres"){
      const meses=talleresEnriched.filter(e=>e.parsed&&!e.parsed.monthOnly).map(e=>e.parsed.m);
      setMonth(meses.length?Math.min(...meses):4);
    }
    else if(tab==="fortalecimiento"){
      const meses=fortalecimientoEnriched.filter(e=>e.parsed&&!e.parsed.monthOnly).map(e=>e.parsed.m);
      setMonth(meses.length?Math.min(...meses):6);
    }
    else if(tab==="combined")setMonth(m=>m<2?4:m);
  },[tab]);

  const locs=useMemo(()=>[...new Set(events.map(e=>e.localidad))].sort(),[events]);
  const filtered=useMemo(()=>events.filter(e=>(filterTipo==="ALL"||e.tipo===filterTipo)&&(filterLoc==="ALL"||e.localidad===filterLoc)),[events,filterTipo,filterLoc]);
  const parquesFiltered=useMemo(()=>parquesEnriched.filter(e=>filterParque==="ALL"||e.parque===filterParque),[parquesEnriched,filterParque]);

  const dayRecreo=useCallback((d)=>filtered.filter(e=>e.parsed&&e.parsed.m===month&&e.parsed.d===d),[filtered,month]);
  const dayParques=useCallback((d)=>parquesFiltered.filter(e=>e.parsed&&e.parsed.m===month&&e.parsed.d===d),[parquesFiltered,month]);
  const dayTalleres=useCallback((d)=>talleresEnriched.filter(e=>e.parsed&&e.parsed.m===month&&e.parsed.d===d),[talleresEnriched,month]);
  const dayRetos=useCallback((d)=>retosEvents.filter(e=>e.parsed&&e.parsed.m===month&&e.parsed.d===d),[retosEvents,month]);
  const dayFortalecimiento=useCallback((d)=>fortalecimientoEnriched.filter(e=>e.parsed&&e.parsed.m===month&&e.parsed.d===d),[fortalecimientoEnriched,month]);

  const monthOnlyEvents=useMemo(()=>filtered.filter(e=>e.parsed&&e.parsed.m===month&&e.parsed.monthOnly),[filtered,month]);
  const listEvents=useMemo(()=>[...filtered].sort((a,b)=>a.parsed.m!==b.parsed.m?a.parsed.m-b.parsed.m:!a.parsed.d?1:!b.parsed.d?-1:a.parsed.d-b.parsed.d),[filtered]);
  const parquesList=useMemo(()=>[...parquesFiltered].sort((a,b)=>a.parsed.m!==b.parsed.m?a.parsed.m-b.parsed.m:a.parsed.d-b.parsed.d),[parquesFiltered]);
  const talleresList=useMemo(()=>[...talleresEnriched].sort((a,b)=>a.parsed.m!==b.parsed.m?a.parsed.m-b.parsed.m:a.parsed.d-b.parsed.d),[talleresEnriched]);
  const fortalecimientoList=useMemo(()=>[...fortalecimientoEnriched].sort((a,b)=>a.parsed.m!==b.parsed.m?a.parsed.m-b.parsed.m:a.parsed.d-b.parsed.d),[fortalecimientoEnriched]);

  const daysInMonth=new Date(YEAR,month+1,0).getDate();
  const firstDay=new Date(YEAR,month,1).getDay();
  const cells=[];
  for(let i=0;i<firstDay;i++)cells.push(null);
  for(let d=1;d<=daysInMonth;d++)cells.push(d);

  const stats=useMemo(()=>{const s={};for(const t of Object.keys(TIPO))s[t]=filtered.filter(e=>e.tipo===t).length;return s;},[filtered]);

  const statusColor=source==="live-sharepoint"?"#22C55E":source==="loading"?C.textMuted:"#EF4444";
  const statusBg=source==="live-sharepoint"?"rgba(34,197,94,0.12)":source==="loading"?"rgba(100,116,139,0.12)":"rgba(239,68,68,0.12)";
  const statusLabel=source==="loading"?"Cargando...":source==="live-sharepoint"?"EN VIVO":"OFFLINE";

  const TABS=[
    {k:"recreo",icon:"📅",label:"Recreolab",clr:C.accent,bg:C.accentGlow},
    {k:"combined",icon:"🔀",label:"Combinado",clr:"#818CF8",bg:"rgba(99,102,241,0.12)"},
    {k:"parques",icon:"🛡️",label:"Parques",clr:"#22C55E",bg:"rgba(34,197,94,0.12)"},
    {k:"talleres",icon:"🎓",label:"Talleres",clr:"#818CF8",bg:"rgba(99,102,241,0.12)"},
    {k:"retos",icon:"🏆",label:"Retos",clr:"#10B981",bg:"rgba(16,185,129,0.12)"},
    {k:"fortalecimiento",icon:"🌱",label:"DRAFE",clr:"#A855F7",bg:"rgba(168,85,247,0.12)"},

  const filaSuperior=TABS.slice(0,splitIndex);

  return html`

      ${source==="offline"&&html`
        <div style=${{background:"rgba(239,68,68,0.1)",borderBottom:"1px solid rgba(239,68,68,0.25)",padding:"8px 20px",fontSize:11,color:"#EF4444",fontWeight:700,textAlign:"center"}}>

      <header style=${{padding:"20px 20px 0",background:"linear-gradient(145deg,"+C.surface+" 0%,"+C.bg+" 100%)",borderBottom:"1px solid "+C.border,position:"relative",overflow:"hidden"}}>

          <div style=${{display:"flex",alignItems:"center",gap:8}}>
            <div style=${{width:36,height:36,borderRadius:10,background:"linear-gradient(135deg,"+C.accent+",#DC2626)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,boxShadow:"0 4px 12px "+C.accentGlow}}>📅</div>

              :talleresList.map((ev,i)=>{
                const clr=TALLER_CLR[ev.grupo]||{bg:"#6366F1"};
                const wd=new Date(YEAR,ev.parsed.m,ev.parsed.d).toLocaleDateString("es-CO",{weekday:"long"});
                return html`<div key=${i}>
                  <div style=${{display:"flex",alignItems:"center",gap:8,padding:"12px 0 6px",borderBottom:"1px solid "+C.border,marginBottom:6}}>
                    <div style=${{fontSize:20,fontWeight:800,color:clr.bg,fontFamily:"'JetBrains Mono'"}}>${ev.parsed.d}</div>
                    <div><div style=${{fontSize:12,fontWeight:700,color:C.text,textTransform:"capitalize"}}>${wd}</div><div style=${{fontSize:10,color:C.textMuted}}>${MFULL[ev.parsed.m]} 2026</div></div>
                  </div>
                  <${TallerCard} ev=${ev}/>
                </div>`;
              })}
          </div>
        </div>`}

      <!-- ═══════ TAB: FORTALECIMIENTO ═══════ -->
      ${tab==="fortalecimiento"&&html`
        <div class="fade-up">
          <div style=${{margin:"12px 16px 0",borderRadius:14,background:"linear-gradient(135deg,rgba(168,85,247,0.1),rgba(34,197,94,0.05))",border:"1px solid rgba(168,85,247,0.25)",padding:"14px 16px"}}>
            <div style=${{display:"flex",alignItems:"center",gap:10}}>
              <span style=${{fontSize:28}}>🌱</span>
              <div>
                <div style=${{fontSize:15,fontWeight:800,color:"#A855F7"}}>DRAFE</div>
                <div style=${{fontSize:11,color:C.textMuted}}>Cronograma DRAFE ${YEAR}</div>
              </div>
              <div style=${{marginLeft:"auto",textAlign:"right"}}>
                <div style=${{fontSize:16,fontWeight:800,color:"#A855F7",fontFamily:"'JetBrains Mono'"}}>${fortalecimientoEnriched.length}</div>
                <div style=${{fontSize:10,color:C.textMuted}}>eventos</div>
              </div>
            </div>
          </div>
          <div style=${{margin:"8px 16px 0",padding:"8px 12px",borderRadius:10,background:C.surface,border:"1px solid "+C.border,display:"flex",alignItems:"center",gap:8}}>
            ${fortalecimientoSource==="loading"&&html`<span style=${{fontSize:12,animation:"spin 1s linear infinite",display:"inline-block"}}>↻</span><span style=${{fontSize:12,color:C.textMuted}}>Cargando desde GitHub…</span>`}
            ${fortalecimientoSource==="live"&&html`
              <div style=${{width:7,height:7,borderRadius:"50%",background:"#22C55E"}}/>
              <span style=${{fontSize:12,color:C.textMuted,flex:1}}>EN VIVO · Excel Online vía Power Automate</span>`}
            ${fortalecimientoSource==="offline"&&html`
              <div style=${{width:7,height:7,borderRadius:"50%",background:"#EF4444"}}/>
              <span style=${{fontSize:12,color:"#EF4444",flex:1}}>OFFLINE · mostrando datos embebidos</span>`}
          </div>
          <${MonthNav} month=${month} setMonth=${setMonth} minMonth=${0} maxMonth=${11}/>
          <${CalGrid} cells=${cells} month=${month} dayEvents=${dayFortalecimiento} accentColor=${"#A855F7"} dotShape="square"
            onDayClick=${day=>{const evs=dayFortalecimiento(day);if(evs.length)setSelected({evs,day,tipo:"fortalecimiento"});}}/>
          <div style=${{padding:"8px 16px 24px"}}>
            ${fortalecimientoList.length===0
              ?html`<div style=${{textAlign:"center",padding:40,color:C.textMuted}}><div style=${{fontSize:32,marginBottom:8}}>🌱</div><p>Sin eventos</p></div>`
              :fortalecimientoList.map((ev,i)=>{
                const clr=FORTALECIMIENTO_CLR[ev.tipo]||{bg:"#A855F7"};
                const wd=new Date(YEAR,ev.parsed.m,ev.parsed.d).toLocaleDateString("es-CO",{weekday:"long"});
                return html`<div key=${i}>
                  <div style=${{display:"flex",alignItems:"center",gap:8,padding:"12px 0 6px",borderBottom:"1px solid "+C.border,marginBottom:6}}>
                    <div style=${{fontSize:20,fontWeight:800,color:clr.bg,fontFamily:"'JetBrains Mono'"}}>${ev.parsed.d}</div>
                    <div><div style=${{fontSize:12,fontWeight:700,color:C.text,textTransform:"capitalize"}}>${wd}</div><div style=${{fontSize:10,color:C.textMuted}}>${MFULL[ev.parsed.m]} 2026</div></div>
                  </div>
                  <${FortalecimientoCard} ev=${ev}/>
                </div>`;
              })}
          </div>
        </div>`}

      <!-- ═══════ TAB: RETOS ═══════ -->
      ${tab==="retos"&&html`
        <div class="fade-up">
          <div style=${{margin:"12px 16px 0",borderRadius:14,background:"linear-gradient(135deg,rgba(16,185,129,0.1),rgba(99,102,241,0.05))",border:"1px solid rgba(16,185,129,0.25)",padding:"14px 16px"}}>
            <div style=${{display:"flex",alignItems:"center",gap:10}}>
              <span style=${{fontSize:28}}>🏆</span>
              <div>
                <div style=${{fontSize:15,fontWeight:800,color:"#10B981"}}>Retos TEAM IDRD 2026</div>
                <div style=${{fontSize:11,color:C.textMuted}}>Seguimiento por localidad · actualizado cada 6h</div>
              </div>
              <div style=${{marginLeft:"auto",textAlign:"right"}}>
                <div style=${{fontSize:16,fontWeight:800,color:"#10B981",fontFamily:"'JetBrains Mono'"}}>${retosEvents.length}</div>
                <div style=${{fontSize:10,color:C.textMuted}}>eventos</div>
              </div>
            </div>
          </div>
          <div style=${{margin:"8px 16px 0",padding:"8px 12px",borderRadius:10,background:C.surface,border:"1px solid "+C.border,display:"flex",alignItems:"center",gap:8}}>
            ${retosSource==="loading"&&html`<span style=${{fontSize:12,animation:"spin 1s linear infinite",display:"inline-block"}}>↻</span><span style=${{fontSize:12,color:C.textMuted}}>Cargando desde GitHub…</span>`}
            ${retosSource==="ok"&&html`
              <div style=${{width:7,height:7,borderRadius:"50%",background:"#22C55E"}}/>
              <span style=${{fontSize:12,color:C.textMuted,flex:1}}>Datos actualizados · Power Automate cada 6h</span>
              <button onClick=${()=>{setRetosSource("idle");setRetosEvents([]);}} style=${{fontSize:10,padding:"3px 8px",borderRadius:6,border:"1px solid "+C.border,background:C.bg,color:C.textMuted,cursor:"pointer"}}>↻</button>`}
            ${retosSource==="error"&&html`
              <div style=${{width:7,height:7,borderRadius:"50%",background:"#EF4444"}}/>
              <span style=${{fontSize:12,color:"#EF4444",flex:1}}>No se pudo cargar el CSV</span>
              <button onClick=${()=>setRetosSource("idle")} style=${{fontSize:10,padding:"3px 8px",borderRadius:6,border:"1px solid "+C.border,background:C.bg,color:C.textMuted,cursor:"pointer"}}>Reintentar</button>`}
            ${retosSource==="idle"&&html`<span style=${{fontSize:12,color:C.textMuted}}>Iniciando…</span>`}
          </div>
          ${retosEvents.length>0&&html`
            <div style=${{padding:"10px 16px 0",display:"flex",gap:5,flexWrap:"wrap"}}>
              <button class="chip" onClick=${()=>setFilterReto("ALL")} style=${{padding:"4px 10px",borderRadius:20,fontSize:10,fontWeight:700,background:filterReto==="ALL"?"#10B981":C.surface,color:filterReto==="ALL"?"#fff":C.textMuted}}>TODOS</button>
              ${["RETO 1","RETO 2","RETO 3","RETO 4"].map(r=>{
                const clr=RETO_CLR[r]||{bg:"#6B7280"};
                const cnt=retosEvents.filter(e=>e.reto===r).length;
                if(!cnt)return null;
                return html`<button key=${r} class="chip" onClick=${()=>setFilterReto(filterReto===r?"ALL":r)}
                  style=${{padding:"4px 10px",borderRadius:20,fontSize:10,fontWeight:700,background:filterReto===r?clr.bg:C.surface,color:filterReto===r?"#fff":C.textMuted}}>🏆 ${r} (${cnt})</button>`;
              })}
            </div>`}
          ${retosEvents.length>0&&(()=>{
            const filtrados=retosEvents.filter(e=>filterReto==="ALL"||e.reto===filterReto);
            const ejecutados=filtrados.filter(e=>e.ejecutado).length;
            const pendientes=filtrados.length-ejecutados;
            return html`
              <div style=${{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,margin:"10px 16px 0"}}>
                ${[{label:"Total",val:filtrados.length,clr:"#10B981"},{label:"Ejecutados",val:ejecutados,clr:"#22C55E"},{label:"Pendientes",val:pendientes,clr:"#FBBF24"}].map(s=>html`
                  <div key=${s.label} style=${{background:C.surface,borderRadius:10,padding:"10px 8px",textAlign:"center",border:"1px solid "+C.border}}>
                    <div style=${{fontSize:20,fontWeight:800,color:s.clr,fontFamily:"'JetBrains Mono'"}}>${s.val}</div>
                    <div style=${{fontSize:9,color:C.textMuted,fontWeight:700,letterSpacing:"0.5px",marginTop:1}}>${s.label.toUpperCase()}</div>
                  </div>`)}
              </div>`;
          })()}
          <div style=${{padding:"12px 16px 24px"}}>
            ${retosEvents.length===0&&retosSource==="ok"&&html`<div style=${{textAlign:"center",padding:40,color:C.textMuted}}><div style=${{fontSize:32,marginBottom:8}}>🔍</div><p>Sin eventos registrados</p></div>`}
            ${(()=>{
              const filtrados=retosEvents.filter(e=>filterReto==="ALL"||e.reto===filterReto).sort((a,b)=>a.parsed.m!==b.parsed.m?a.parsed.m-b.parsed.m:a.parsed.d-b.parsed.d);
              let lastM=-1;
              return filtrados.map((ev,i)=>{
                const isNewM=ev.parsed.m!==lastM;lastM=ev.parsed.m;
                const wd=new Date(YEAR,ev.parsed.m,ev.parsed.d).toLocaleDateString("es-CO",{weekday:"long"});
                return html`<div key=${i}>
                  ${isNewM&&html`<div style=${{fontSize:13,fontWeight:800,color:"#10B981",padding:"14px 0 8px",borderBottom:"1px solid "+C.border,marginBottom:8,letterSpacing:"-0.3px"}}>${MFULL[ev.parsed.m]} ${YEAR}</div>`}
                  <div style=${{display:"flex",alignItems:"center",gap:6,marginBottom:2}}>
                    <span style=${{fontSize:11,color:C.textDim,fontFamily:"'JetBrains Mono'",minWidth:20,textAlign:"right"}}>${ev.parsed.d}</span>
                    <span style=${{fontSize:10,color:C.textDim,textTransform:"capitalize"}}>${wd.split(",")[0]}</span>
                  </div>
                  <${RetoCard} ev=${ev} expanded=${true}/>
                </div>`;
              });
            })()}
          </div>
        </div>`}

      <!-- ═══════ MODAL ═══════ -->
      ${selected&&html`
        <div onClick=${()=>setSelected(null)}
          style=${{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:100,display:"flex",alignItems:"flex-end",justifyContent:"center",backdropFilter:"blur(6px)"}}>
          <div onClick=${e=>e.stopPropagation()}
            style=${{background:C.surface,borderRadius:"20px 20px 0 0",padding:"16px 16px 32px",width:"100%",maxWidth:480,maxHeight:"78vh",overflowY:"auto",border:"1px solid "+C.border,borderBottom:"none",animation:"slideUp 0.3s ease"}}>
            <div style=${{width:36,height:4,borderRadius:2,background:C.border,margin:"0 auto 14px"}}/>
            <h3 style=${{fontSize:16,fontWeight:800,marginBottom:12,letterSpacing:"-0.3px"}}>
              ${selected.day} de ${MFULL[month]}
            </h3>
            ${selected.tipo==="recreo"&&selected.evs?.map((ev,i)=>html`<${EventCard} key=${i} ev=${ev} expanded=${true}/>`)}
            ${selected.tipo==="parques"&&selected.evs?.map((ev,i)=>html`<${ParquesCard} key=${i} ev=${ev}/>`)}
            ${selected.tipo==="talleres"&&selected.evs?.map((ev,i)=>html`<${TallerCard} key=${i} ev=${ev}/>`)}
            ${selected.tipo==="fortalecimiento"&&selected.evs?.map((ev,i)=>html`<${FortalecimientoCard} key=${i} ev=${ev}/>`)}
            ${selected.tipo==="combined"&&html`
              ${selected.recreo?.length>0&&html`<div style=${{fontSize:11,color:C.accent,fontWeight:700,marginBottom:6,letterSpacing:"0.5px"}}>📅 RECREOLAB</div>${selected.recreo.map((ev,i)=>html`<${EventCard} key=${i} ev=${ev} expanded=${true}/>`)}`}
              ${selected.parques?.length>0&&html`<div style=${{fontSize:11,color:"#22C55E",fontWeight:700,margin:"12px 0 6px",letterSpacing:"0.5px"}}>🛡️ PARQUES</div>${selected.parques.map((ev,i)=>html`<${ParquesCard} key=${i} ev=${ev}/>`)}`}
              ${selected.talleres?.length>0&&html`<div style=${{fontSize:11,color:"#6366F1",fontWeight:700,margin:"12px 0 6px",letterSpacing:"0.5px"}}>🎓 TALLERES</div>${selected.talleres.map((ev,i)=>html`<${TallerCard} key=${i} ev=${ev}/>`)}`}
              ${selected.retos?.length>0&&html`<div style=${{fontSize:11,color:"#10B981",fontWeight:700,margin:"12px 0 6px",letterSpacing:"0.5px"}}>🏆 RETOS</div>${selected.retos.map((ev,i)=>html`<${RetoCard} key=${i} ev=${ev} expanded=${true}/>`)}`}
              ${selected.fortalecimiento?.length>0&&html`<div style=${{fontSize:11,color:"#A855F7",fontWeight:700,margin:"12px 0 6px",letterSpacing:"0.5px"}}>🌱 DRAFE</div>${selected.fortalecimiento.map((ev,i)=>html`<${FortalecimientoCard} key=${i} ev=${ev}/>`)}`}`}
            <button onClick=${()=>setSelected(null)}
              style=${{width:"100%",padding:12,borderRadius:12,border:"none",background:C.bg,color:C.text,fontSize:13,fontWeight:700,cursor:"pointer",marginTop:8}}>Cerrar</button>
          </div>
        </div>`}

      <div style=${{padding:"8px 20px 20px",textAlign:"center"}}>
        <p style=${{fontSize:10,color:C.textDim}}>${events.length} Recreolab · ${PARQUES_SEG.length} Parques · ${talleresEnriched.length} Talleres${talleresSource==="live"?" (en vivo)":talleresSource==="offline"?" (offline)":""} · ${retosEvents.length} Retos · ${fortalecimientoEnriched.length} DRAFE${fortalecimientoSource==="live"?" (en vivo)":fortalecimientoSource==="offline"?" (offline)":""} · ${source==="live-sharepoint"?"SharePoint (en vivo)":"datos embebidos"}</p>
      </div>
    </div>`;
}

ReactDOM.createRoot(document.getElementById("app")).render(React.createElement(App));
  </script>
</body>
</html>
